groups:
 - name: Vibrators
   label: T-Code
   icon: ⚡️
   color: "#777722"
   match:
     - "match:tcode*"
session_name: pyeep-muse
windows:
  - window_name: Main
    layout: even-vertical
    shell_command_before:
      - cd ~/dev/pyeep-nsfw/
    panes:
      - python3 -m pyeep.hub  -v --config=../pyeep/scenes/groups.yaml --config=../pyeep/scenes/consent-cfg.yaml --config=scenes/groups.yaml --config=scenes/consent-cfg.yaml
      - python3 -m pyeep.muse -a 00:55:DA:B7:DE:A1 -m yesno --hub .webtoken -v
      - python3 -m pyeep.happylights --hub .webtoken -v -a 21:04:99:10:35:05
      - python3 -m nsfw.bp --hub .webtoken -v
