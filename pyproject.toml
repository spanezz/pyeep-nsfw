[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nsfw"
dynamic = ["version"]
requires-python = ">= 3.13"

[tool.pytest.ini_options]
# addopts = ["--import-mode=importlib", "--ignore=doc"]
addopts = ["--ignore=doc"]

[tool.black]
line-length = 80

[tool.pylint.MAIN]
max-line-length = 80

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html
mypy_path = "stubs"
packages = ["nsfw"]
modules = ["tests"]

# strict = true
